<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PPL Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --surface: #111;
  --card: #161616;
  --card2: #1c1c1c;
  --border: #252525;
  --pull: #3b9ede;
  --push: #e05c4b;
  --legs: #3dbd6e;
  --warm: #f5a623;
  --text: #f0f0f0;
  --muted: #555;
  --muted2: #888;
  --success: #3dbd6e;
  --radius: 14px;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  padding-bottom: 90px;
  max-width: 480px;
  margin: 0 auto;
}

/* HEADER */
.app-header {
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 100;
}

.app-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 3px;
}

.app-date {
  font-size: 11px;
  color: var(--muted2);
  font-weight: 300;
}

.streak-badge {
  background: rgba(245,166,35,0.12);
  border: 1px solid rgba(245,166,35,0.3);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--warm);
  display: flex;
  align-items: center;
  gap: 5px;
}

/* NAV */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 200;
}

.nav-btn {
  flex: 1;
  padding: 12px 4px 14px;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: color 0.2s;
}

.nav-btn .nav-icon { font-size: 18px; }
.nav-btn.active { color: var(--warm); }

/* PAGES */
.page { display: none; padding: 0 16px; }
.page.active { display: block; }

/* TODAY PAGE */
.today-header {
  padding: 20px 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.today-day-badge {
  display: flex;
  align-items: center;
  gap: 10px;
}

.day-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
}

.today-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 2px;
}

.today-sub {
  font-size: 12px;
  color: var(--muted2);
  margin-top: 2px;
}

.rest-day-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 20px;
  text-align: center;
  margin-top: 12px;
}

.rest-day-card .rest-emoji { font-size: 40px; margin-bottom: 12px; }
.rest-day-card h3 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--muted2); }
.rest-day-card p { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* EXERCISE CARDS */
.exercise-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color 0.2s;
}

.exercise-card.completed { border-color: rgba(61,189,110,0.3); }

.ex-card-header {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  gap: 12px;
  cursor: pointer;
}

.ex-card-header .ex-num {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  flex-shrink: 0;
}

.pull-day .ex-num { background: rgba(59,158,222,0.15); color: var(--pull); }
.push-day .ex-num { background: rgba(224,92,75,0.15); color: var(--push); }
.legs-day .ex-num { background: rgba(61,189,110,0.15); color: var(--legs); }

.ex-card-info { flex: 1; }
.ex-card-name { font-size: 14px; font-weight: 600; }
.ex-card-sub { font-size: 11px; color: var(--muted2); margin-top: 2px; }

.ex-card-status {
  font-size: 18px;
  flex-shrink: 0;
}

.ex-card-body {
  padding: 0 16px 16px;
  border-top: 1px solid var(--border);
  display: none;
}

.ex-card-body.open { display: block; }

.sets-grid {
  display: grid;
  grid-template-columns: 40px 1fr 1fr 40px;
  gap: 6px;
  align-items: center;
  margin-top: 12px;
}

.sets-grid-header {
  display: grid;
  grid-template-columns: 40px 1fr 1fr 40px;
  gap: 6px;
  margin-top: 10px;
  padding-bottom: 4px;
}

.sets-grid-header span {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  text-align: center;
}

.set-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px;
  color: var(--muted2);
  text-align: center;
}

.set-input {
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 8px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 500;
  text-align: center;
  width: 100%;
  -webkit-appearance: none;
}

.set-input:focus {
  outline: none;
  border-color: var(--warm);
}

.set-check {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 2px solid var(--border);
  background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  margin: 0 auto;
  transition: all 0.2s;
}

.set-check.done {
  background: var(--success);
  border-color: var(--success);
}

.pr-badge {
  background: rgba(245,166,35,0.15);
  border: 1px solid rgba(245,166,35,0.3);
  color: var(--warm);
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  margin-left: 6px;
  letter-spacing: 0.5px;
}

.last-session {
  background: var(--card2);
  border-radius: 8px;
  padding: 10px 12px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--muted2);
}

.last-session strong { color: var(--text); font-weight: 500; }

.finish-btn {
  width: 100%;
  padding: 16px;
  border-radius: var(--radius);
  border: none;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 2px;
  cursor: pointer;
  margin-top: 16px;
  transition: opacity 0.2s;
}

.pull-day .finish-btn { background: var(--pull); color: #fff; }
.push-day .finish-btn { background: var(--push); color: #fff; }
.legs-day .finish-btn { background: var(--legs); color: #fff; }

/* HISTORY PAGE */
.history-filter {
  display: flex;
  gap: 8px;
  padding: 16px 0 12px;
  overflow-x: auto;
  scrollbar-width: none;
}

.filter-btn {
  padding: 7px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  color: var(--muted2);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}

.filter-btn.active { background: var(--warm); border-color: var(--warm); color: #000; font-weight: 600; }

.history-session {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}

.history-session-header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.history-day-tag {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px;
  letter-spacing: 1px;
  padding: 4px 10px;
  border-radius: 6px;
}

.tag-pull { background: rgba(59,158,222,0.15); color: var(--pull); }
.tag-push { background: rgba(224,92,75,0.15); color: var(--push); }
.tag-legs { background: rgba(61,189,110,0.15); color: var(--legs); }

.history-session-info { flex: 1; }
.history-session-date { font-size: 13px; font-weight: 500; }
.history-session-sub { font-size: 11px; color: var(--muted2); margin-top: 2px; }

.history-session-body {
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: none;
}

.history-session-body.open { display: block; }

.history-ex-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.history-ex-row:last-child { border-bottom: none; }
.history-ex-sets { color: var(--muted2); font-size: 12px; }

/* PROGRESS PAGE */
.progress-header {
  padding: 20px 0 4px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 2px;
}

.progress-sub {
  font-size: 12px;
  color: var(--muted2);
  margin-bottom: 16px;
}

.stat-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}

.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
}

.stat-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 1px;
  color: var(--warm);
}

.stat-label {
  font-size: 10px;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

.pr-section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--muted2);
  text-transform: uppercase;
  margin: 16px 0 8px;
}

.pr-list-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.pr-ex-name { font-size: 13px; font-weight: 500; }
.pr-ex-day { font-size: 10px; color: var(--muted2); margin-top: 2px; }

.pr-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 1px;
}

.pr-value.pull { color: var(--pull); }
.pr-value.push { color: var(--push); }
.pr-value.legs { color: var(--legs); }

/* TOAST */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--success);
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  padding: 12px 20px;
  border-radius: 20px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 999;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 500;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 24px 20px 40px;
  width: 100%;
  max-width: 480px;
  border-top: 1px solid var(--border);
}

.modal h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 2px;
  margin-bottom: 16px;
}

.modal-close {
  width: 100%;
  padding: 14px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--muted2);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  cursor: pointer;
  margin-top: 12px;
}

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; }

/* Animations */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.page.active > * {
  animation: slideUp 0.3s ease both;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.sync-indicator {
  position: fixed;
  top: 12px;
  right: 16px;
  font-size: 10px;
  color: var(--muted);
  z-index: 999;
  display: flex;
  align-items: center;
  gap: 4px;
}
.sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--muted);
}
.sync-dot.syncing { background: var(--warm); animation: pulse 1s infinite; }
.sync-dot.synced { background: var(--success); }
.sync-dot.error { background: var(--push); }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.3 } }

#loginScreen {
  position: fixed; inset: 0; background: var(--bg); z-index: 1000;
  display: none; flex-direction: column; align-items: center;
  justify-content: center; padding: 48px 28px;
  min-height: 100vh; min-height: 100dvh;
}
#loginScreen .login-logo {
  font-family: 'Bebas Neue', sans-serif; font-size: 56px;
  letter-spacing: 4px; color: var(--text); margin-bottom: 2px;
  line-height: 1;
}
#loginStepPin {
  display: none; width: 100%; max-width: 320px;
  flex-direction: column; align-items: center;
}
.user-chip {
  display: flex; align-items: center; gap: 6px;
  background: rgba(245,166,35,0.12); border: 1px solid rgba(245,166,35,0.3);
  border-radius: 20px; padding: 4px 10px 4px 6px;
  font-size: 12px; color: var(--warm); font-weight: 600; cursor: pointer;
}
.user-avatar {
  width: 22px; height: 22px; border-radius: 50%; background: var(--warm);
  color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-logo">PPL<span style="color:var(--warm)">.</span></div>
  <div style="font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:4px;color:var(--muted2);margin-bottom:48px;">TRACKER</div>

  <!-- Stap 1: Naam -->
  <div id="loginStepName" style="width:100%;max-width:300px;">
    <div style="font-size:11px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;text-align:center;">Wie ben jij?</div>
    <input id="nameInput" type="text" placeholder="Voer je naam in" autocomplete="off" autocorrect="off" autocapitalize="off"
      onkeydown="if(event.key==='Enter')doNameStep()"
      style="width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:18px;text-align:center;letter-spacing:1px;margin-bottom:12px;-webkit-appearance:none;outline:none;box-sizing:border-box;">
    <button onclick="doNameStep()" style="width:100%;padding:16px;background:var(--warm);border:none;border-radius:14px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;">VERDER →</button>
    <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6;">Gebruik altijd dezelfde naam<br>op elk apparaat</div>
  </div>

  <!-- Stap 2: PIN -->
  <div id="loginStepPin" style="display:none;width:100%;max-width:300px;flex-direction:column;align-items:center;">
    <div style="font-size:13px;color:var(--muted2);margin-bottom:4px;text-align:center;" id="pinWelcome"></div>
    <div class="pin-title" id="pinTitle">PINCODE</div>
    <div class="pin-sub" id="pinSub">Voer je pincode in</div>
    <div class="pin-dots">
      <div class="pin-dot" id="pd0"></div>
      <div class="pin-dot" id="pd1"></div>
      <div class="pin-dot" id="pd2"></div>
      <div class="pin-dot" id="pd3"></div>
    </div>
    <div class="pin-grid">
      <button class="pin-btn" onclick="pinPress(1)">1</button>
      <button class="pin-btn" onclick="pinPress(2)">2</button>
      <button class="pin-btn" onclick="pinPress(3)">3</button>
      <button class="pin-btn" onclick="pinPress(4)">4</button>
      <button class="pin-btn" onclick="pinPress(5)">5</button>
      <button class="pin-btn" onclick="pinPress(6)">6</button>
      <button class="pin-btn" onclick="pinPress(7)">7</button>
      <button class="pin-btn" onclick="pinPress(8)">8</button>
      <button class="pin-btn" onclick="pinPress(9)">9</button>
      <button class="pin-btn del" onclick="goBackToName()" title="Terug">←</button>
      <button class="pin-btn" onclick="pinPress(0)">0</button>
      <button class="pin-btn del" onclick="pinDel()">⌫</button>
    </div>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>


<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsOverlay" onclick="closeSettings(event)">
  <div class="modal">
    <h3>SCHEMA INSTELLEN</h3>
    <div style="font-size:12px;color:var(--muted2);margin-bottom:16px;">Kies welke dagen jij traint en welke training.</div>
    <div id="scheduleEditor"></div>
    <button onclick="saveScheduleSettings()" style="width:100%;padding:14px;background:var(--warm);border:none;border-radius:10px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;margin-top:8px;">OPSLAAN</button>
    <button class="modal-close" onclick="document.getElementById('settingsOverlay').classList.remove('open')">Sluiten</button>
  </div>
</div>

<!-- PAGES -->
<div id="pageTrain" class="page active"></div>
<div id="pageHistory" class="page"></div>
<div id="pageProgress" class="page"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showPage('train', this)">
    <span class="nav-icon">💪</span>Vandaag
  </button>
  <button class="nav-btn" onclick="showPage('history', this)">
    <span class="nav-icon">📋</span>Historie
  </button>
  <button class="nav-btn" onclick="showPage('progress', this)">
    <span class="nav-icon">📈</span>Progressie
  </button>
  <button class="nav-btn" onclick="openSettings()">
    <span class="nav-icon">⚙️</span>Schema
  </button>
</nav>



<!-- EXERCISE INFO MODAL -->
<div class="modal-overlay" id="exInfoOverlay" onclick="closeExInfo(event)">
  <div class="modal" id="exInfoModal" style="max-height:85vh;overflow-y:auto;">
    <div id="exInfoContent"></div>
    <button class="modal-close" onclick="document.getElementById('exInfoOverlay').classList.remove('open')">Sluiten</button>
  </div>
</div>

<!-- DAY MODAL -->
<div class="modal-overlay" id="dayModalOverlay" onclick="closeDayModal(event)">
  <div class="modal" id="dayModal">
    <div id="dayModalContent"></div>
    <button class="modal-close" onclick="document.getElementById('dayModalOverlay').classList.remove('open')">Sluiten</button>
  </div>
</div>

<div class="toast" id="toast"></div>


<script>

// LOGIN
async function doLogin() {
  await doNameStep();
}

async function doNameStep() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name || name.length < 2) {
    input.style.borderColor = '#e05c4b';
    input.style.borderWidth = '2px';
    setTimeout(() => { input.style.borderColor = 'var(--border)'; input.style.borderWidth = '1px'; }, 1000);
    return;
  }
  USER_ID = setUserId(name);
  await loadUserSchedule();

  // Check if PIN exists
  const existingPin = await getStoredPin();
  if (existingPin) {
    await showPinScreen('verify');
  } else {
    await showPinScreen('create');
  }
}

function updateUserDisplay() {
  const name = USER_ID || '?';
  const el = document.getElementById('userName');
  const av = document.getElementById('userAvatar');
  if (el) el.textContent = name;
  if (av) av.textContent = name.charAt(0).toUpperCase();
}

function showUserSwitch() {
  if (confirm('Wisselen van gebruiker? Je bent nu: ' + USER_ID)) {
    localStorage.removeItem('ppl_uid');
    _sessionCache = null; _prCache = null; _weightCache = null; _photoCache = null;
    USER_ID = null;
    const ls = document.getElementById('loginScreen');
    ls.style.display = 'flex';
    document.getElementById('nameInput').value = '';
  }
}

function setSyncStatus(status) {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if (!dot) return;
  dot.className = 'sync-dot ' + status;
  label.textContent = status === 'syncing' ? 'syncing...' : status === 'synced' ? 'opgeslagen' : status === 'error' ? 'offline' : '';

// ─── STORAGE (Supabase + localStorage fallback) ───────────────────────────────
async function getSessions() {
  if (_sessionCache) return _sessionCache;
  try {
    const { data, error } = await sb.from('ppl_sessions').select('*').eq('user_id', USER_ID).order('date', { ascending: true });
    if (error) throw error;
    _sessionCache = data.map(s => ({ date: s.date, type: s.type, variant: s.variant, data: s.data, _id: s.id }));
    return _sessionCache;
  } catch(e) {
    return JSON.parse(localStorage.getItem('ppl_sessions') || '[]');
  }
}

async function saveSession(sessionObj) {
  setSyncStatus('syncing');
  try {
    const existing = await sb.from('ppl_sessions').select('id').eq('user_id', USER_ID).eq('date', sessionObj.date).single();
    if (existing.data) {
      await sb.from('ppl_sessions').update({ type: sessionObj.type, variant: sessionObj.variant, data: sessionObj.data }).eq('id', existing.data.id);
    } else {
      await sb.from('ppl_sessions').insert({ user_id: USER_ID, date: sessionObj.date, type: sessionObj.type, variant: sessionObj.variant, data: sessionObj.data });
    }
    setSyncStatus('synced');
    _sessionCache = null;
  } catch(e) {
    setSyncStatus('error');
    const sessions = JSON.parse(localStorage.getItem('ppl_sessions') || '[]');
    const idx = sessions.findIndex(s => s.date === sessionObj.date);
    if (idx >= 0) sessions[idx] = sessionObj; else sessions.push(sessionObj);
    localStorage.setItem('ppl_sessions', JSON.stringify(sessions));
  }
}

async function getTodaySession() {
  const today = new Date().toISOString().split('T')[0];
  const sessions = await getSessions();
  return sessions.find(s => s.date === today) || null;
}

async function getLastSession(type) {
  const sessions = (await getSessions()).filter(s => s.type === type);
  return sessions.length > 1 ? sessions[sessions.length - 2] : null;
}

async function getPRs() {
  try {
    const { data, error } = await sb.from('ppl_prs').select('*').eq('user_id', USER_ID);
    if (error) throw error;
    const prs = {};
    data.forEach(p => { prs[p.exercise_id] = { weight: p.weight, date: p.date }; });
    return prs;
  } catch(e) {
    return JSON.parse(localStorage.getItem('ppl_prs') || '{}');
  }
}

async function savePR(exId, weight, date) {
  try {
    const existing = await sb.from('ppl_prs').select('id,weight').eq('user_id', USER_ID).eq('exercise_id', exId).single();
    if (existing.data) {
      if (weight > existing.data.weight) {
        await sb.from('ppl_prs').update({ weight, date }).eq('id', existing.data.id);
      }
    } else {
      await sb.from('ppl_prs').insert({ user_id: USER_ID, exercise_id: exId, weight, date });
    }
  } catch(e) {
    const prs = JSON.parse(localStorage.getItem('ppl_prs') || '{}');
    if (!prs[exId] || weight > prs[exId].weight) {
      prs[exId] = { weight, date };
      localStorage.setItem('ppl_prs', JSON.stringify(prs));
    }
  }
}

async function getWeightHistory() {
  try {
    const { data, error } = await sb.from('ppl_weights').select('*').eq('user_id', USER_ID).order('date', { ascending: true });
    if (error) throw error;
    return data.map(w => ({ date: w.date, weight: parseFloat(w.weight) }));
  } catch(e) {
    return JSON.parse(localStorage.getItem('ppl_weights') || '[]');
  }
}

async function saveWeightToDb(date, weight) {
  setSyncStatus('syncing');
  try {
    const existing = await sb.from('ppl_weights').select('id').eq('user_id', USER_ID).eq('date', date).single();
    if (existing.data) {
      await sb.from('ppl_weights').update({ weight }).eq('id', existing.data.id);
    } else {
      await sb.from('ppl_weights').insert({ user_id: USER_ID, date, weight });
    }
    setSyncStatus('synced');
  } catch(e) {
    setSyncStatus('error');
    const wh = JSON.parse(localStorage.getItem('ppl_weights') || '[]');
    const idx = wh.findIndex(w => w.date === date);
    if (idx >= 0) wh[idx].weight = weight; else wh.push({ date, weight });
    localStorage.setItem('ppl_weights', JSON.stringify(wh));
  }
}

async function getProgressPhotos() {
  try {
    const { data, error } = await sb.from('ppl_photos').select('*').eq('user_id', USER_ID).order('date', { ascending: true });
    if (error) throw error;
    // Get signed URLs for each photo
    const photos = await Promise.all(data.map(async p => {
      let url = null;
      if (p.storage_path) {
        const { data: signed } = await sb.storage.from('ppl-photos').createSignedUrl(p.storage_path, 3600);
        url = signed?.signedUrl || null;
      } else if (p.data) {
        url = p.data; // fallback for old base64 photos
      }
      return { date: p.date, weight: p.weight, data: url, _id: p.id, storage_path: p.storage_path };
    }));
    return photos.filter(p => p.data);
  } catch(e) {
    return JSON.parse(localStorage.getItem('ppl_photos') || '[]');
  }
}

async function savePhotoToDb(date, weight, file) {
  setSyncStatus('syncing');
  try {
    // Upload to Supabase Storage
    const ext = file.name?.split('.').pop() || 'jpg';
    const path = `${USER_ID}/${date}_${Date.now()}.${ext}`;
    const { data: uploadData, error: uploadError } = await sb.storage.from('ppl-photos').upload(path, file, { upsert: false });
    if (uploadError) throw uploadError;
    // Save reference in database
    await sb.from('ppl_photos').insert({ user_id: USER_ID, date, weight, storage_path: path });
    setSyncStatus('synced');
  } catch(e) {
    setSyncStatus('error');
    console.error('Photo upload failed', e);
    showToast('Foto upload mislukt');
  }
}

async function deletePhotoFromDb(id, storagePath) {
  try {
    if (storagePath) {
      await sb.storage.from('ppl-photos').remove([storagePath]);
    }
    await sb.from('ppl_photos').delete().eq('id', id);
  } catch(e) {
    console.error('Delete photo failed', e);
  }
}

// Default schedule - overridden by user settings
const DEFAULT_SCHEDULE = { 2: 'pull', 5: 'push', 0: 'legs' };

async function getUserSchedule() {
  try {
    const { data, error } = await sb.from('ppl_settings').select('schedule').eq('user_id', USER_ID).maybeSingle();
    if (data?.schedule) {
      localStorage.setItem('ppl_schedule_' + USER_ID, JSON.stringify(data.schedule));
      return data.schedule;
    }
  } catch(e) {}
  // Fallback to localStorage
  const stored = localStorage.getItem('ppl_schedule_' + USER_ID);
  return stored ? JSON.parse(stored) : DEFAULT_SCHEDULE;
}

async function saveUserSchedule(schedule) {
  // Save locally immediately
  localStorage.setItem('ppl_schedule_' + USER_ID, JSON.stringify(schedule));
  // Save to Supabase
  try {
    const { data } = await sb.from('ppl_settings').select('id').eq('user_id', USER_ID).maybeSingle();
    if (data) {
      await sb.from('ppl_settings').update({ schedule }).eq('user_id', USER_ID);
    } else {
      const pin = await getStoredPin();
      await sb.from('ppl_settings').insert({ user_id: USER_ID, schedule, pin: pin || null });
    }
  } catch(e) {
    console.error('Schedule save to Supabase failed', e);
  }
}

// Get exercises for a session (A or B based on session count)
function getExercises(type, variant) {
  return WORKOUTS[type][variant || 'a'];
}

// Determine A or B for today
function getVariantForToday(type) {
  const sessions = (_sessionCache || []).filter(s => s.type === type);
  return sessions.length % 2 === 0 ? 'a' : 'b';
}

function getVariantForSession(session) {
  // stored in session, or derive from index
  if (session.variant) return session.variant;
  const allOfType = (_sessionCache || []).filter(s => s.type === session.type);
  const idx = allOfType.findIndex(s => s.date === session.date);
  return idx % 2 === 0 ? 'a' : 'b';
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function todayType() {
  const dow = new Date().getDay();
  return SCHEDULE[dow] || null;
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

async function getStreak() {
  try {
    const { data, error } = await sb.from('ppl_streaks').select('streak').eq('user_id', USER_ID).maybeSingle();
    if (data && !error) return data.streak;
  } catch(e) {}
  return 0;
}

async function saveStreak(value) {
  try {
    const { data } = await sb.from('ppl_streaks').select('id').eq('user_id', USER_ID).maybeSingle();
    const today = localDateStr(new Date());
    if (data) {
      await sb.from('ppl_streaks').update({ streak: value, last_updated: today }).eq('user_id', USER_ID);
    } else {
      await sb.from('ppl_streaks').insert({ user_id: USER_ID, streak: value, last_updated: today });
    }
  } catch(e) {
    console.error('Streak save failed', e);
  }
}

async function incrementStreak() {
  const current = await getStreak();
  await saveStreak(current + 1);
  return current + 1;
}

function renderExerciseCard(ex, idx, type, prs) {
  const sets = currentSessionData[ex.id] || [{weight:'',reps:'',done:false},{weight:'',reps:'',done:false},{weight:'',reps:'',done:false}];
  const allDone = sets.every(s => s.done);
  const pr = prs[ex.id];
  const lastSession = getLastSession(type);
  const lastData = lastSession?.data?.[ex.id];
  const lastBest = lastData ? Math.max(...lastData.filter(s=>s.weight).map(s=>parseFloat(s.weight)||0)) : 0;

  return `
    <div class="exercise-card ${allDone ? 'completed' : ''}" id="card_${ex.id}">
      <div class="ex-card-header" onclick="toggleCard('${ex.id}')">
        <div class="ex-num">${idx + 1}</div>
        <div class="ex-card-info">
          <div class="ex-card-name">${ex.name}${pr ? `<span class="pr-badge">PR ${pr.weight}kg</span>` : ''}</div>
          <div class="ex-card-sub">${ex.tip} · ${ex.target}</div>
        </div>
        <button onclick="event.stopPropagation();openExerciseInfo('${ex.id}','${type}')" style="background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--muted2);font-size:12px;cursor:pointer;flex-shrink:0;">?</button>
        <div class="ex-card-status">${allDone ? '✅' : '○'}</div>
      </div>
      <div class="ex-card-body" id="body_${ex.id}">
        ${lastBest > 0 ? `<div class="last-session">Vorige keer: <strong>${lastBest}kg</strong></div>` : ''}
        <div class="sets-grid-header">
          <span>Set</span><span>Kg</span><span>Reps</span><span>✓</span>
        </div>
        ${sets.map((set, si) => `
          <div class="sets-grid">
            <div class="set-label">${si + 1}</div>
            <input class="set-input" type="number" inputmode="decimal" placeholder="kg"
              value="${set.weight}" onchange="updateSet('${ex.id}',${si},'weight',this.value,'${type}')">
            <input class="set-input" type="number" inputmode="numeric" placeholder="reps"
              value="${set.reps}" onchange="updateSet('${ex.id}',${si},'reps',this.value,'${type}')">
            <button class="set-check ${set.done ? 'done' : ''}" id="check_${ex.id}_${si}"
              onclick="toggleSetDone('${ex.id}',${si},'${type}')">
              ${set.done ? '✓' : ''}
            </button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function toggleCard(exId) {
  const body = document.getElementById(`body_${exId}`);
  body.classList.toggle('open');
}

async function updateSet(exId, setIdx, field, value, type) {
  if (!currentSessionData[exId]) return;
  currentSessionData[exId][setIdx][field] = value;
  await checkPR(exId, type);
  await autoSave(type);
}

async function toggleSetDone(exId, setIdx, type) {
  if (!currentSessionData[exId]) return;
  currentSessionData[exId][setIdx].done = !currentSessionData[exId][setIdx].done;
  const btn = document.getElementById(`check_${exId}_${setIdx}`);
  const isDone = currentSessionData[exId][setIdx].done;
  btn.classList.toggle('done', isDone);
  btn.textContent = isDone ? '✓' : '';

  // Check if all sets done
  const allDone = currentSessionData[exId].every(s => s.done);
  const card = document.getElementById(`card_${exId}`);
  card.classList.toggle('completed', allDone);
  const status = card.querySelector('.ex-card-status');
  status.textContent = allDone ? '✅' : '○';

  await checkPR(exId, type);
  await autoSave(type);
}

async function checkPR(exId, type) {
  const sets = currentSessionData[exId];
  const maxWeight = Math.max(...sets.filter(s => s.weight).map(s => parseFloat(s.weight) || 0));
  if (maxWeight <= 0) return;
  const prs = await getPRs();
  const currentPR = prs[exId]?.weight || 0;
  if (maxWeight > currentPR) {
    const date = new Date().toISOString().split('T')[0];
    await savePR(exId, maxWeight, date);
    if (currentPR > 0) {
      showToast(`🏆 PR! ${maxWeight}kg op ${[...getExercises(type,'a'),...getExercises(type,'b')].find(e=>e.id===exId)?.name}`);
    }
  }
}

async function autoSave(type) {
  const today = new Date().toISOString().split('T')[0];
  await saveSession({ date: today, type, variant: currentVariant, data: currentSessionData });
}

async function finishWorkout(type) {
  await autoSave(type);
  const newStreak = await incrementStreak();
  document.getElementById('streakCount').textContent = newStreak;
  showToast('✅ Training opgeslagen! 🔥 ' + newStreak + ' streak');
  // Show done screen
  _sessionCache = null; // invalidate so done check picks up new session
  await renderToday();
}

    `).join('')}
  `;

function drawWeightChart(wh) {
  if (wh.length < 2) return '';
  const W = 300, H = 90, PAD = 30, RPAD = 8, TPAD = 8, BPAD = 20;
  const plotW = W - PAD - RPAD;
  const plotH = H - TPAD - BPAD;
  const weights = wh.map(w => w.weight);
  const minW = Math.min(...weights) * 0.97;
  const maxW = Math.max(...weights) * 1.02;
  const range = maxW - minW || 1;

  const points = wh.map((w, i) => ({
    x: PAD + (i / (wh.length - 1)) * plotW,
    y: TPAD + plotH - ((w.weight - minW) / range) * plotH,
    ...w
  }));

  const pathD = points.map((p,i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${TPAD+plotH} L${PAD},${TPAD+plotH} Z`;
  const dots = points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#f5a623" stroke="#111" stroke-width="2"/>`).join('');

  const labelIdxs = wh.length <= 4 ? wh.map((_,i)=>i) : [0, Math.floor((wh.length-1)/2), wh.length-1];
  const xlabels = labelIdxs.map(i => {
    const d = new Date(wh[i].date);
    return `<text x="${points[i].x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="8.5" fill="#555">${d.getDate()}/${d.getMonth()+1}</text>`;
  }).join('');

  const yvals = [minW, maxW];
  const ylabels = yvals.map(v => {
    const y = TPAD + plotH - ((v - minW) / range) * plotH;
    return `<text x="${PAD-4}" y="${y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="8.5" fill="#555">${v.toFixed(1)}</text>`;
  }).join('');

  return `<div style="margin-top:12px;">
    <div style="font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Gewicht over tijd (kg)</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;">
      <defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f5a623" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="${PAD}" y1="${TPAD}" x2="${PAD}" y2="${TPAD+plotH}" stroke="#252525" stroke-width="1"/>
      <line x1="${PAD}" y1="${TPAD+plotH}" x2="${W-RPAD}" y2="${TPAD+plotH}" stroke="#252525" stroke-width="1"/>
      <path d="${areaD}" fill="url(#wgrad)"/>
      <path d="${pathD}" fill="none" stroke="#f5a623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}${xlabels}${ylabels}
    </svg>
  </div>`;
}

// ─── PROGRESS ─────────────────────────────────────────────────────────────────
let selectedExercise = null;

function getExHistory(exId) {
  return (_sessionCache || [])
    .filter(s => s.data?.[exId])
    .map(s => {
      const sets = (s.data[exId]||[]).filter(set => set.done && set.weight && set.reps);
      if (!sets.length) return null;
      const maxWeight = Math.max(...sets.map(s => parseFloat(s.weight)||0));
      return { date: s.date, maxWeight };
    })
    .filter(Boolean);
}

function drawChart(exId, color) {
  const history = getExHistory(exId);
  if (history.length < 2) return `<div style="padding:16px;text-align:center;color:var(--muted);font-size:12px;">Minimaal 2 sessies nodig voor grafiek</div>`;

  const W = 300, H = 110, PAD = 34, RPAD = 8, TPAD = 10, BPAD = 22;
  const plotW = W - PAD - RPAD;
  const plotH = H - TPAD - BPAD;
  const weights = history.map(h => h.maxWeight);
  const minW = Math.min(...weights) * 0.92;
  const maxW = Math.max(...weights) * 1.06;
  const range = maxW - minW || 1;

  const points = history.map((h, i) => ({
    x: PAD + (i / (history.length - 1)) * plotW,
    y: TPAD + plotH - ((h.maxWeight - minW) / range) * plotH,
    ...h
  }));

  const pathD = points.map((p,i) => `${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${TPAD+plotH} L${PAD},${TPAD+plotH} Z`;
  const dots = points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${color}" stroke="#111" stroke-width="2"/>`).join('');

  const labelIdxs = history.length <= 3 ? history.map((_,i)=>i) : [0, Math.floor((history.length-1)/2), history.length-1];
  const xlabels = labelIdxs.map(i => {
    const d = new Date(history[i].date);
    return `<text x="${points[i].x.toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="8.5" fill="#555">${d.getDate()}/${d.getMonth()+1}</text>`;
  }).join('');

  const yvals = [minW, (minW+maxW)/2, maxW];
  const ylabels = yvals.map(v => {
    const y = TPAD + plotH - ((v - minW) / range) * plotH;
    return `<text x="${PAD-4}" y="${y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" font-size="8.5" fill="#555">${v.toFixed(0)}</text>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;">
    <defs><linearGradient id="g_${exId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${PAD}" y1="${TPAD}" x2="${PAD}" y2="${TPAD+plotH}" stroke="#252525" stroke-width="1"/>
    <line x1="${PAD}" y1="${TPAD+plotH}" x2="${W-RPAD}" y2="${TPAD+plotH}" stroke="#252525" stroke-width="1"/>
    <path d="${areaD}" fill="url(#g_${exId})"/>
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${xlabels}${ylabels}
  </svg>`;
}

// ─── PIN CODE ─────────────────────────────────────────────────────────────────
let pinBuffer = '';
let pinMode = 'verify'; // 'verify', 'create', 'confirm'
let pinFirst = '';

async function getStoredPin() {
  try {
    const { data } = await sb.from('ppl_settings').select('pin').eq('user_id', USER_ID).maybeSingle();
    return data?.pin || null;
  } catch(e) {
    return localStorage.getItem('ppl_pin_' + USER_ID) || null;
  }
}

async function savePin(pin) {
  try {
    const { data } = await sb.from('ppl_settings').select('id').eq('user_id', USER_ID).maybeSingle();
    if (data) {
      await sb.from('ppl_settings').update({ pin }).eq('user_id', USER_ID);
    } else {
      await sb.from('ppl_settings').insert({ user_id: USER_ID, pin, schedule: SCHEDULE });
    }
    localStorage.setItem('ppl_pin_' + USER_ID, pin);
  } catch(e) {
    localStorage.setItem('ppl_pin_' + USER_ID, pin);
  }
}

async function showPinScreen(mode) {
  pinMode = mode;
  pinBuffer = '';
  pinFirst = '';
  updatePinDots();
  document.getElementById('pinError').textContent = '';

  // Show login screen with pin step
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginStepName').style.display = 'none';
  const pinStep = document.getElementById('loginStepPin');
  pinStep.style.display = 'flex';

  const welcome = document.getElementById('pinWelcome');
  if (welcome) welcome.textContent = 'Welkom, ' + USER_ID;

  if (mode === 'create') {
    document.getElementById('pinTitle').textContent = 'KIES PINCODE';
    document.getElementById('pinSub').textContent = 'Maak een 4-cijferige pincode aan';
  } else if (mode === 'confirm') {
    document.getElementById('pinTitle').textContent = 'BEVESTIG';
    document.getElementById('pinSub').textContent = 'Voer je pincode nogmaals in';
  } else {
    document.getElementById('pinTitle').textContent = 'PINCODE';
    document.getElementById('pinSub').textContent = 'Voer je pincode in';
  }
}

function goBackToName() {
  pinBuffer = '';
  pinFirst = '';
  document.getElementById('loginStepName').style.display = 'block';
  document.getElementById('loginStepPin').style.display = 'none';
  localStorage.removeItem('ppl_uid');
  USER_ID = null;
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('pd' + i);
    dot.className = 'pin-dot' + (i < pinBuffer.length ? ' filled' : '');
  }
}

async function pinPress(num) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += num;
  updatePinDots();
  if (pinBuffer.length === 4) {
    await handlePinComplete();
  }
}

function pinDel() {
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDots();
}

function pinClear() {
  pinBuffer = '';
  updatePinDots();
}

async function handlePinComplete() {
  if (pinMode === 'verify') {
    const stored = await getStoredPin();
    if (pinBuffer === stored) {
      document.getElementById('loginScreen').style.display = 'none';
      updateUserDisplay();
      await renderToday();
    } else {
      // Wrong PIN
      for (let i = 0; i < 4; i++) document.getElementById('pd' + i).className = 'pin-dot error';
      document.getElementById('pinError').textContent = 'Onjuiste pincode';
      setTimeout(() => { pinBuffer = ''; updatePinDots(); document.getElementById('pinError').textContent = ''; }, 1000);
    }
  } else if (pinMode === 'create') {
    pinFirst = pinBuffer;
    pinBuffer = '';
    await showPinScreen('confirm');
  } else if (pinMode === 'confirm') {
    if (pinBuffer === pinFirst) {
      await savePin(pinBuffer);
      document.getElementById('loginScreen').style.display = 'none';
      updateUserDisplay();
      await renderToday();
      showToast('✅ Pincode ingesteld!');
    } else {
      for (let i = 0; i < 4; i++) document.getElementById('pd' + i).className = 'pin-dot error';
      document.getElementById('pinError').textContent = 'Pincodes komen niet overeen';
      setTimeout(() => { pinBuffer = ''; pinFirst = ''; showPinScreen('create'); }, 1200);
    }
  }
}

// ─── SCHEDULE SETTINGS ───────────────────────────────────────────────────────
async function openSettings() {
  const schedule = await getUserSchedule();
  const days = ['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];
  const dowMap = [1,2,3,4,5,6,0]; // index to JS day of week
  const colors = {pull:'var(--pull)',push:'var(--push)',legs:'var(--legs)',rest:'var(--muted)'};

  let html = '';
  days.forEach((day, i) => {
    const dow = dowMap[i];
    const current = schedule[dow] || 'rest';
    html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
      <span style="font-size:13px;font-weight:500;">${day}</span>
      <div style="display:flex;gap:6px;">
        ${['pull','push','legs','rest'].map(t => `
          <button onclick="setDayType(${dow},'${t}')" id="schbtn_${dow}_${t}"
            style="padding:5px 10px;border-radius:6px;border:1px solid ${current===t?colors[t]:'var(--border)'};
            background:${current===t?`rgba(${t==='pull'?'59,158,222':t==='push'?'224,92,75':t==='legs'?'61,189,110':'100,100,100'},0.15)`:'transparent'};
            color:${current===t?colors[t]:'var(--muted)'};font-size:11px;font-family:'Bebas Neue',sans-serif;letter-spacing:1px;cursor:pointer;">
            ${t.toUpperCase()}
          </button>
        `).join('')}
      </div>
    </div>`;
  });

  document.getElementById('scheduleEditor').innerHTML = html;
  document.getElementById('settingsOverlay').classList.add('open');
}

let tempSchedule = null;

function setDayType(dow, type) {
  if (!tempSchedule) tempSchedule = {...getUserSchedule()};
  if (type === 'rest') {
    delete tempSchedule[dow];
  } else {
    tempSchedule[dow] = type;
  }
  // Update button styles
  ['pull','push','legs','rest'].forEach(t => {
    const btn = document.getElementById(`schbtn_${dow}_${t}`);
    if (!btn) return;
    const colors = {pull:'var(--pull)',push:'var(--push)',legs:'var(--legs)',rest:'var(--muted)'};
    const isActive = t === type;
    btn.style.borderColor = isActive ? colors[t] : 'var(--border)';
    btn.style.color = isActive ? colors[t] : 'var(--muted)';
    const rgb = {pull:'59,158,222',push:'224,92,75',legs:'61,189,110',rest:'100,100,100'};
    btn.style.background = isActive ? `rgba(${rgb[t]},0.15)` : 'transparent';
  });
}

async function saveScheduleSettings() {
  if (tempSchedule !== null) {
    await saveUserSchedule(tempSchedule);
    SCHEDULE = tempSchedule;
    tempSchedule = null;
  }
  document.getElementById('settingsOverlay').classList.remove('open');
  showToast('✅ Schema opgeslagen!');
  await renderToday();
}

function closeSettings(event) {
  if (event.target === document.getElementById('settingsOverlay')) {
    tempSchedule = null;
    document.getElementById('settingsOverlay').classList.remove('open');
  }
}

// ─── DAY MODAL ────────────────────────────────────────────────────────────────
function openDayModal(dow) {
  const dayNames = ['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];
  const dayName = dayNames[dow];
  const dayType = SCHEDULE[dow];
  const colors = {pull:'var(--pull)',push:'var(--push)',legs:'var(--legs)'};
  const accentColor = dayType ? colors[dayType] : 'var(--muted2)';

  // Find most recent session for this dow
  const allSessions = getSessions();
  const pastSession = allSessions.slice().reverse().find(s => new Date(s.date).getDay() === dow);

  const nextVar = dayType ? getVariantForToday(dayType) : null;
  const showVar = pastSession ? (pastSession.variant || 'a') : nextVar;
  let html = `<div style="margin-bottom:16px;">
    <div style="font-size:11px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">${dayName}</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:${accentColor}">${dayType ? dayType.toUpperCase() + ' DAY' : 'RUSTDAG'}</div>
      ${dayType ? `<div style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:2px 10px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:2px;color:var(--warm);">WORKOUT ${showVar.toUpperCase()}</div>` : ''}
    </div>
    ${dayType ? `<div style="font-size:12px;color:var(--muted2);margin-top:2px;">${WORKOUTS[dayType].muscles}</div>` : ''}
  </div>`;

  if (!dayType) {
    html += `<div style="background:var(--card2);border-radius:10px;padding:16px;text-align:center;color:var(--muted2);font-size:13px;">
      😴 Rustdag — herstel is onderdeel van het programma
    </div>`;
  } else if (pastSession) {
    // Show what was done
    html += `<div style="font-size:11px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">Laatste sessie · ${formatDate(pastSession.date)}</div>`;
    getExercises(dayType, pastSession ? getVariantForSession(pastSession) : nextVariant).forEach(ex => {
      const sets = pastSession.data?.[ex.id] || [];
      const doneSets = sets.filter(s => s.done && s.weight && s.reps);
      html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);">
        <span style="font-size:13px;">${ex.name}</span>
        <span style="font-size:12px;color:var(--muted2);">${doneSets.length ? doneSets.map(s=>`${s.weight}kg×${s.reps}`).join(' · ') : '—'}</span>
      </div>`;
    });
  } else {
    // Show what to do (schema preview)
    html += `<div style="font-size:11px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;">Oefeningen — tik voor uitleg</div>`;
    const nextVariant = getVariantForToday(dayType);
    const modalExercises = pastSession ? getExercises(dayType, getVariantForSession(pastSession)) : getExercises(dayType, nextVariant);
    modalExercises.forEach((ex, i) => {
      html += `<div onclick="document.getElementById('dayModalOverlay').classList.remove('open');setTimeout(()=>openExerciseInfo('${ex.id}','${dayType}'),200)" style="display:flex;justify-content:space-between;align-items:center;padding:10px 8px;border-radius:8px;margin-bottom:2px;cursor:pointer;border:1px solid transparent;" onmouseenter="this.style.background='rgba(255,255,255,0.04)'" onmouseleave="this.style.background='transparent'">
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:500;">${ex.name}</div>
          <div style="font-size:11px;color:var(--muted2);margin-top:2px;">${ex.tip}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:12px;">
          <span style="font-size:12px;color:${accentColor};font-family:'Bebas Neue',sans-serif;letter-spacing:1px;white-space:nowrap;">${ex.target}</span>
          <span style="font-size:11px;color:var(--muted);">›</span>
        </div>
      </div>`;
    });
    html += `<div style="margin-top:12px;background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.2);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--warm);">Nog geen sessie opgeslagen voor deze dag</div>`;
  }

  document.getElementById('dayModalContent').innerHTML = html;
  document.getElementById('dayModalOverlay').classList.add('open');
}

function closeDayModal(event) {
  if (event.target === document.getElementById('dayModalOverlay')) {
    document.getElementById('dayModalOverlay').classList.remove('open');
  }
}
